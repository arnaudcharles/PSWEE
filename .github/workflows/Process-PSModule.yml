name: Process-PSModule

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    # Pinned to the #529 fix commit until v8.0.4 is released, then revert to @v8.
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@68696b6223ecb17c7807ae4eb108a5f4c0419c4a
    secrets:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      GitHubAppClientId: ${{ secrets.APP_CLIENT_ID }}
      GitHubAppPrivateKey: ${{ secrets.APP_PRIVATE_KEY }}
